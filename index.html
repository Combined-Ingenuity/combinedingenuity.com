<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Domain Parked</title>
    <style>
        :root {
            --bg: #f5f5f4;
            --fg: #1c1c1c;
            --muted: #6b6b6b;
            --rule: #d6d4d0;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            text-align: center;
        }

        main {
            max-width: 32rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            margin: 0 0 1rem;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--rule);
            margin: 1.25rem auto;
            width: 3rem;
        }

        p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--muted);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #131313;
                --fg: #ededed;
                --muted: #9a9a9a;
                --rule: #333;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>This domain is parked.</h1>
        <hr>
        <p>This domain has been parked by the owner.</p>
    </main>
</body>
</html>
